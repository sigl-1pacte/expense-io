services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_io
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense -d expense_io']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # MinIO a fermé l'accès anonyme à ses images officielles — LocalStack
    # (édition communautaire, S3 uniquement) est le remplaçant retenu.
    # Épinglé sur la branche 3.x : `:latest`/`:stable` exigent désormais un
    # `LOCALSTACK_AUTH_TOKEN` (licence).
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: s3
    ports:
      - '4567:4566'
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Serveur SMTP de dev : capture les e-mails (interface sur http://localhost:8025).
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  sonarqube:
    # Analyse de qualité, à la demande : `make sonar-up`. Hors du `up` habituel.
    image: sonarqube@sha256:0b3408443fb6a311253de27941b10977c9b977fd53be2265947bfe14161308b8 # sonarqube:community
    profiles: [quality]
    environment:
      # Elasticsearch embarqué : sans ça, il exige vm.max_map_count=262144 sur l'hôte.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    ports:
      - '9000:9000'
    volumes:
      - sonarqube-data:/opt/sonarqube/data

volumes:
  postgres-data:
  localstack-data:
  sonarqube-data:
