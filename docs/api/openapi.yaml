openapi: 3.1.0
info:
  title: Expense.io API
  version: 0.2.0
  summary: API HTTP de l'application de gestion de notes de frais.
  description: |
    Ce document décrit le contrat de l'application. Depuis la version 0.2.0,
    les erreurs sont au format RFC 9457 et les codes 401/403 sont cohérents
    entre les espaces ; les réponses en succès sont inchangées.

    ## Authentification

    Toutes les routes `/api/*` hors `/api/auth/*` exigent la session Auth.js,
    portée par le cookie `authjs.session-token` (JWT, `HttpOnly`,
    `SameSite=Lax`, 30 jours ; préfixé `__Secure-` derrière HTTPS). Pour
    l'obtenir hors navigateur : `GET /api/auth/csrf` puis
    `POST /api/auth/callback/credentials` (voir le tag *Auth*).

    Rôles : `employee`, `manager`, `hr_admin`.

    | Espace | Rôle exigé | Sans session | Mauvais rôle |
    |---|---|---|---|
    | `/api/expense-notes/*` | tout utilisateur connecté | `401` | — |
    | `/api/manager/*` | `manager` | `401` | `403` |
    | `/api/hr/*` | `hr_admin` | `401` | `403` |

    ## Circuit de validation

    - Une note d'un utilisateur ayant un manager est tranchée par **ce
      manager** (`/api/manager/*`).
    - Une note d'un **manager racine** (rôle `manager`, sans manager
      assigné) est tranchée par un **RH de la même entreprise**
      (`/api/hr/*`).
    - Une note n'est tranchée qu'une fois : `pending` → `approved` ou
      `rejected`, sinon `409 Already decided`.

    ## Erreurs

    Toutes les erreurs sont au format RFC 9457 (`application/problem+json`) :
    `{ error, type, title, status, detail }`. Le champ `error` garde le texte
    historique. Une erreur non gérée renvoie `500` avec `error: "Erreur
    interne"`, sans pile d'appels ni message interne ; l'en-tête
    `x-correlation-id` permet de retrouver la trace dans les logs.

    ## Interfaces internes (hors HTTP)

    Ces interfaces ne sont pas des routes REST et ne peuvent donc pas être
    décrites comme des `paths` OpenAPI ; leur contrat est consigné ici.

    **Server Actions** (`src/app/actions/auth.ts`), appelées par les
    formulaires `/signup`, `/login` et le bouton de déconnexion :

    - `signup(name, email, password)` : nom non vide, email valide, mot de
      passe ≥ 8 caractères, email non déjà utilisé. Le premier compte d'un
      domaine email crée l'entreprise (nom = premier segment du domaine) et
      devient `hr_admin` ; les suivants la rejoignent comme `employee`. Le
      rôle `manager` n'est jamais attribué par l'inscription. Connexion
      automatique puis redirection vers `/expenses`.
    - `login(email, password)` : redirection vers `/expenses`, sinon erreur
      « Email ou mot de passe incorrect. ».
    - `logout()` : redirection vers `/login`.

    **Ports** (`src/ports/`) : `ReceiptStoragePort` (`upload`,
    `getSignedUrl`, implémenté par `S3ReceiptAdapter`) et `NotificationPort`
    (`notifyDecision`, implémenté par `ConsoleNotificationAdapter`). Ils ne
    sont actuellement branchés sur aucune route.

    **Dépendances sortantes** : PostgreSQL (isolation par Row Level Security
    via `app.current_user_id`) et stockage objet S3 (bucket `receipts`,
    clés `receipts/<receipt_seq><extension>`, URL présignées valables 300 s).
servers:
  - url: http://localhost:3000
    description: Serveur de développement local (`make dev`)
tags:
  - name: Auth
    description: Routes Auth.js (fournisseur `credentials`) utilisées pour ouvrir et fermer une session.
  - name: Employé
    description: Notes de frais de l'utilisateur connecté, quel que soit son rôle.
  - name: Manager
    description: Validation des notes des subordonnés directs du manager connecté.
  - name: RH
    description: Validation des notes des managers racines et gestion du rattachement hiérarchique.
security:
  - sessionCookie: []

paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Obtenir le jeton CSRF
      description: Pose aussi le cookie `authjs.csrf-token`, qui doit accompagner la connexion.
      security: []
      responses:
        '200':
          description: Jeton CSRF.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string

  /api/auth/callback/credentials:
    post:
      tags: [Auth]
      operationId: signInWithCredentials
      summary: Se connecter par email et mot de passe
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrfToken, email, password]
              properties:
                csrfToken:
                  type: string
                  description: Valeur renvoyée par `GET /api/auth/csrf`.
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                callbackUrl:
                  type: string
                  description: Destination de la redirection en cas de succès (défaut `/`).
      responses:
        '302':
          description: |
            Succès : `Location` vaut `callbackUrl` et le cookie
            `authjs.session-token` est posé.
            Échec : `Location` vaut `/login?error=CredentialsSignin&code=credentials`
            et aucun cookie de session n'est posé.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string

  /api/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Lire la session courante
      security: []
      responses:
        '200':
          description: Session courante, ou `null` sans session valide.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - type: 'null'

  /api/auth/providers:
    get:
      tags: [Auth]
      operationId: getProviders
      summary: Lister les fournisseurs d'authentification
      security: []
      responses:
        '200':
          description: Seul le fournisseur `credentials` est configuré.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
                    signinUrl:
                      type: string
                      format: uri
                    callbackUrl:
                      type: string
                      format: uri

  /api/auth/signout:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Fermer la session
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrfToken]
              properties:
                csrfToken:
                  type: string
                callbackUrl:
                  type: string
      responses:
        '302':
          description: Cookie de session supprimé, redirection vers `callbackUrl`.
          headers:
            Location:
              schema:
                type: string

  /api/expense-notes:
    get:
      tags: [Employé]
      operationId: listMyExpenseNotes
      summary: Lister mes notes de frais
      description: Toutes les notes de l'utilisateur connecté, tous statuts confondus.
      parameters:
        - name: sort
          in: query
          required: false
          description: |
            Tri : `<colonne> [asc|desc]`, colonne parmi `created_at`, `expense_date`, `amount`
            (insensible à la casse, `asc` par défaut). Toute autre valeur est ignorée :
            tri par défaut `created_at desc`.
          schema:
            type: string
            examples: ['amount asc', 'expense_date desc']
      responses:
        '200':
          description: Notes de l'utilisateur.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseNote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Employé]
      operationId: createExpenseNote
      summary: Soumettre une note de frais
      description: |
        Crée une note au statut `pending` puis téléverse le reçu sous la clé
        `receipts/<receipt_seq><extension>` (extension déduite du type MIME).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [amount, expenseDate, description, receipt]
              properties:
                amount:
                  type: string
                  description: Montant en euros, nombre fini strictement positif (lu avec `parseFloat`).
                  example: '42.50'
                expenseDate:
                  type: string
                  format: date
                  description: Date de la dépense (`YYYY-MM-DD`). Une date non reconnue par PostgreSQL produit une erreur 500.
                description:
                  type: string
                  minLength: 1
                  description: Non vide après suppression des espaces.
                receipt:
                  type: string
                  format: binary
                  description: Reçu PNG, JPEG, WebP ou PDF, 10 Mio maximum.
            encoding:
              receipt:
                contentType: image/png, image/jpeg, image/webp, application/pdf
      responses:
        '201':
          description: Note créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseNote'
        '400':
          description: |
            Requête invalide. Messages possibles :
            - `Champs invalides` (champ manquant, montant ≤ 0 ou non numérique, description vide, reçu absent)
            - `Type de fichier non autorisé pour le reçu`
            - `Fichier trop volumineux` (> 10 Mio)
            - `Corps de requête invalide` (corps non multipart)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                champsInvalides:
                  value: { error: Champs invalides }
                typeNonAutorise:
                  value: { error: Type de fichier non autorisé pour le reçu }
                tropVolumineux:
                  value: { error: Fichier trop volumineux }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/expense-notes/receipt-suggestion:
    post:
      tags: [Employé]
      operationId: suggestExpenseNoteFields
      summary: Suggérer montant et date à partir d'un reçu (OCR)
      description: |
        Analyse le reçu par OCR (Tesseract, langue française) sans rien
        enregistrer. Seuls PNG, JPEG et WebP sont analysés ; tout autre type,
        ou un échec de l'OCR, renvoie `{}`. Taille limitée à 10 Mio.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt:
                  type: string
                  format: binary
      responses:
        '200':
          description: Champs reconnus ; chaque champ est absent s'il n'a pas été trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSuggestion'
              examples:
                complet:
                  value: { amount: 42.5, expenseDate: '2026-10-08' }
                rienTrouve:
                  value: {}
        '400':
          description: |
            Requête invalide : `Champs invalides` (champ `receipt` absent ou
            n'étant pas un fichier), `Fichier trop volumineux` (> 10 Mio) ou
            `Corps de requête invalide` (corps non multipart).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { error: Champs invalides }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/expense-notes/{id}/receipt-url:
    get:
      tags: [Employé]
      operationId: getMyReceiptUrl
      summary: Obtenir l'URL du reçu d'une de mes notes
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptUrl'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Note inexistante ou n'appartenant pas à l'utilisateur.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { error: Not found }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/manager/expense-notes:
    get:
      tags: [Manager]
      operationId: listTeamPendingExpenseNotes
      summary: Lister les notes en attente de mes subordonnés directs
      description: Notes `pending` des utilisateurs dont le manager est l'utilisateur connecté, de la plus ancienne à la plus récente.
      responses:
        '200':
          description: Notes en attente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseNote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/manager/expense-notes/{id}/approve:
    post:
      tags: [Manager]
      operationId: managerApproveExpenseNote
      summary: Approuver une note d'un subordonné direct
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          $ref: '#/components/responses/DecidedNote'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoteNotInScope'
        '409':
          $ref: '#/components/responses/AlreadyDecided'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/manager/expense-notes/{id}/reject:
    post:
      tags: [Manager]
      operationId: managerRejectExpenseNote
      summary: Rejeter une note d'un subordonné direct
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          $ref: '#/components/responses/DecidedNote'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoteNotInScope'
        '409':
          $ref: '#/components/responses/AlreadyDecided'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/manager/expense-notes/{id}/receipt-url:
    get:
      tags: [Manager]
      operationId: managerGetReceiptUrl
      summary: Obtenir l'URL du reçu d'une note
      description: Réservé aux notes des subordonnés directs du manager connecté, quel que soit leur statut.
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptUrl'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Note inexistante, ou dont l'auteur n'est pas un subordonné direct du manager connecté.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { error: Not found }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hr/expense-notes:
    get:
      tags: [RH]
      operationId: listRootManagerPendingExpenseNotes
      summary: Lister les notes en attente des managers racines
      description: Notes `pending` des managers sans manager assigné, de la même entreprise que le RH connecté, de la plus ancienne à la plus récente.
      responses:
        '200':
          description: Notes en attente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseNote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hr/expense-notes/{id}/approve:
    post:
      tags: [RH]
      operationId: hrApproveExpenseNote
      summary: Approuver une note d'un manager racine
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          $ref: '#/components/responses/DecidedNote'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RootManagerNoteNotInScope'
        '409':
          $ref: '#/components/responses/AlreadyDecided'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hr/expense-notes/{id}/reject:
    post:
      tags: [RH]
      operationId: hrRejectExpenseNote
      summary: Rejeter une note d'un manager racine
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          $ref: '#/components/responses/DecidedNote'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RootManagerNoteNotInScope'
        '409':
          $ref: '#/components/responses/AlreadyDecided'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hr/expense-notes/{id}/receipt-url:
    get:
      tags: [RH]
      operationId: hrGetReceiptUrl
      summary: Obtenir l'URL du reçu d'une note d'un manager racine
      description: Fonctionne quel que soit le statut de la note.
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptUrl'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RootManagerNoteNotInScope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hr/users:
    get:
      tags: [RH]
      operationId: listCompanyUsers
      summary: Lister l'annuaire de l'entreprise
      description: Utilisateurs `employee` et `manager` de l'entreprise du RH connecté (les RH sont exclus), triés par nom.
      responses:
        '200':
          description: Annuaire.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hr/users/{id}/manager:
    put:
      tags: [RH]
      operationId: assignManager
      summary: Assigner ou retirer le manager d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'utilisateur cible (`employee` ou `manager` de l'entreprise du RH).
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        description: |
          La clé `managerId` est obligatoire ; `managerId: null` retire le
          manager. Un corps absent, non JSON, sans `managerId` ou dont
          `managerId` n'est ni `null` ni un UUID est refusé (`400`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignManagerRequest'
            examples:
              assigner:
                value: { managerId: 1a064f7c-ca30-45db-8ac3-9a2ccc6afad3 }
              retirer:
                value: { managerId: null }
      responses:
        '200':
          description: Utilisateur mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryUser'
        '400':
          description: |
            Identifiant de la cible invalide (`Identifiant invalide`), ou corps
            invalide (`Corps de requête invalide`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                identifiantInvalide:
                  value: { error: Identifiant invalide, type: 'https://expense.io/problems/invalid-input', title: Requête invalide, status: 400, detail: Identifiant invalide }
                corpsInvalide:
                  value: { error: Corps de requête invalide, type: 'https://expense.io/problems/invalid-input', title: Requête invalide, status: 400, detail: Corps de requête invalide }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Cible inexistante, hors de l'entreprise du RH, ou de rôle `hr_admin`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { error: Not found }
        '409':
          description: |
            Manager invalide : `managerId` ne désigne pas, dans l'entreprise
            du RH, un utilisateur de rôle `manager` (un manager d'une autre
            entreprise est invisible, donc refusé), ou l'utilisateur serait
            son propre manager, ou le rattachement fermerait un cycle
            d'organigramme (direct ou long).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { error: Invalid manager }
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: JWT de session Auth.js posé par `POST /api/auth/callback/credentials`.

  parameters:
    NoteId:
      name: id
      in: path
      required: true
      description: Identifiant de la note de frais. Une valeur qui n'est pas un UUID produit une erreur 400.
      schema:
        type: string
        format: uuid

  schemas:
    ExpenseNoteStatus:
      type: string
      enum: [pending, approved, rejected]

    ExpenseNote:
      type: object
      required: [id, userId, amount, expenseDate, description, receiptKey, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: Auteur de la note.
        amount:
          type: number
          exclusiveMinimum: 0
          description: Montant en euros (2 décimales en base).
          example: 42.5
        expenseDate:
          type: string
          format: date
          example: '2026-10-08'
        description:
          type: string
        receiptKey:
          type: string
          description: Clé du reçu dans le stockage objet.
          example: receipts/1.png
        status:
          $ref: '#/components/schemas/ExpenseNoteStatus'
        createdAt:
          type: string
          format: date-time

    ReceiptSuggestion:
      type: object
      properties:
        amount:
          type: number
          description: Plus grand montant trouvé sur la ligne du total (ou sur tout le reçu à défaut).
        expenseDate:
          type: string
          format: date

    ReceiptUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: URL S3 présignée, valable 300 secondes.

    DirectoryUser:
      type: object
      required: [id, name, email, role, managerId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [employee, manager]
        managerId:
          type: [string, 'null']
          format: uuid

    AssignManagerRequest:
      type: object
      properties:
        managerId:
          type: [string, 'null']
          format: uuid

    Session:
      type: object
      required: [user, expires]
      properties:
        user:
          type: object
          required: [id, email, role]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            role:
              type: string
              enum: [employee, manager, hr_admin]
        expires:
          type: string
          format: date-time

    Problem:
      type: object
      description: Erreur RFC 9457 ; `error` reprend le message historique.
      required: [error, type, title, status, detail]
      properties:
        error: { type: string }
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

  responses:
    Unauthorized:
      description: Aucune session valide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example: { error: Unauthorized, type: 'https://expense.io/problems/unauthenticated', title: Authentification requise, status: 401, detail: Unauthorized }

    Forbidden:
      description: Session valide, mais l'utilisateur n'a pas le rôle exigé par l'espace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example: { error: Unauthorized, type: 'https://expense.io/problems/forbidden', title: Accès refusé, status: 403, detail: Unauthorized }

    InvalidId:
      description: L'identifiant du chemin n'est pas un UUID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example: { error: Identifiant invalide, type: 'https://expense.io/problems/invalid-input', title: Requête invalide, status: 400, detail: Identifiant invalide }

    NoteNotInScope:
      description: Note inexistante, ou dont l'auteur n'a pas l'utilisateur connecté pour manager.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example: { error: Not found }

    RootManagerNoteNotInScope:
      description: Note inexistante, ou dont l'auteur n'est pas un manager racine de l'entreprise du RH.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example: { error: Not found }

    AlreadyDecided:
      description: La note n'est plus au statut `pending`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example: { error: Already decided }

    DecidedNote:
      description: Note mise à jour avec son nouveau statut.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseNote'

    ReceiptUrl:
      description: URL temporaire du reçu.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReceiptUrl'

    InternalError:
      description: Erreur interne (message générique, jamais de pile d'appels).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
